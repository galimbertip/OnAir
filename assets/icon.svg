<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- GPverse OnAir — icona dell'app (GPverse) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#0d1a33"/><stop offset="1" stop-color="#03050a"/></radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ff3ff"/><stop offset="1" stop-color="#22c8ff"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowR" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- onde sonore -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M150 170 A120 120 0 0 0 150 330" stroke="#9b7bff" stroke-width="14"/>
    <path d="M112 140 A160 160 0 0 0 112 360" stroke="#9b7bff" stroke-width="12" opacity=".7"/>
    <path d="M362 170 A120 120 0 0 1 362 330" stroke="#9b7bff" stroke-width="14"/>
    <path d="M400 140 A160 160 0 0 1 400 360" stroke="#9b7bff" stroke-width="12" opacity=".7"/>
  </g>
  <!-- microfono -->
  <g fill="none" stroke="url(#mic)" stroke-linecap="round" filter="url(#glow)">
    <rect x="206" y="104" width="100" height="176" rx="50" stroke-width="18"/>
    <path d="M222 160 H290 M222 196 H290 M222 232 H290" stroke-width="8" opacity=".75"/>
    <path d="M170 236 A86 86 0 0 0 342 236" stroke-width="16"/>
    <path d="M256 322 V378 M204 388 H308" stroke-width="16"/>
  </g>
  <!-- spia rossa ON AIR -->
  <circle cx="372" cy="128" r="28" fill="#ff2b4a" filter="url(#glowR)"/>
  <circle cx="364" cy="120" r="9" fill="#ffb3bf" opacity=".8"/>
</svg>
